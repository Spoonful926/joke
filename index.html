<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Event Countdown</title>
    <style>
        body {
            background-color: #333333; /* Gray background */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 40px;
            margin: 0;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        #countdown {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        video {
            max-width: 90%;
            width: 720px;
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>Gaming Cinematic Universe deletion live event countdown:</h1>
    <div id="countdown">Loading countdown...</div>
    
    <!-- Video Player (Muted so it doesn't fight the background music) -->
    <video id="myVideo" controls autoplay muted loop>
        <source src="meme.mp4" type="video/mp4">
    </video>

    <!-- Background Music Player -->
    <audio id="bgMusic" autoplay loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Set the date we're counting down to (Year, Month [0-11], Day, Hour, Minute)
        // Note: Months start at 0 (January is 0, June is 5, December is 11)
        const countdownDate = new Date(2026, 5, 13, 21, 33, 0).getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = countdownDate - now;

            // Time calculations
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Display the result
            document.getElementById("countdown").innerHTML = days + "d " + hours + "h "
            + minutes + "m " + seconds + "s ";

            // If the countdown is finished
            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "EVENT STARTED";
            }
        }, 1000);

        // Browser fix: unmute audio on first click anywhere on the page
        document.addEventListener('click', () => {
            const audio = document.getElementById('bgMusic');
            audio.play();
        }, { once: true });
    </script>

</body>
</html>
