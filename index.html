<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Event Countdown</title>
    <style>
        body {
            background-color: rgb(12, 12, 12); /* New dark background */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 40px;
            margin: 0;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #countdown {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .gif-container {
            margin-top: 20px;
        }
        img {
            max-width: 90%;
            width: 720px;
            border-radius: 0px; /* Removed rounded corners */
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }
        .click-hint {
            color: #ffffff;
            font-size: 1rem;
            margin-top: 10px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>Gaming Cinematic Universe deletion live event countdown:</h1>
    <div id="countdown">Loading countdown...</div>
    
    <div class="gif-container">
        <img src="meme.gif" alt="Live Event Image">
    </div>

    <div class="click-hint">(click me)</div>

    <audio id="bgMusic" autoplay loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Set the countdown target to tomorrow at the exact same hour
        const countdownDate = new Date(2026, 5, 13, 21, 33, 0).getTime(); 

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = countdownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML = days + "d " + hours + "h "
            + minutes + "m " + seconds + "s ";

            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "EVENT STARTED";
            }
        }, 1000);

        // Unmute background music on user click
        document.addEventListener('click', () => {
            const audio = document.getElementById('bgMusic');
            audio.play();
        }, { once: true });
    </script>

</body>
</html>
